name: Draft macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version matching the selected commit (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run release:check
      - run: npm run audit
      - run: npm test
      - run: npm run test:replay
      - run: npm run test:ui
      - run: npm run release:build
      - name: Create a draft with the ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$RELEASE_TAG" release/*.zip release/*.sha256
          --draft --verify-tag --title "Agent Office $RELEASE_TAG"
          --notes-file CHANGELOG.md
