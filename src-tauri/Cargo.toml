[package]
name = "agent-office"
version = "0.1.0"
description = "Read-only local Codex office observer"
edition = "2021"
license = "MIT"
default-run = "agent-office"

[lib]
name = "agent_office"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]
probe = []

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
notify = "8"
tauri = { version = "2", optional = true, features = [] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData", "NSDate", "NSError", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSURLConnection"] }

[[bin]]
name = "agent-office"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "observer-probe"
path = "src/bin/observer_probe.rs"
required-features = ["probe"]
